---
# Interactive step 4: Start the agent container with bind-mounted ~/.zrok2
# Doc: "Start the Agent Container" compose.yml

- name: Create compose project directory
  ansible.builtin.file:
    path: "{{ zrok2_compose_dir }}"
    state: directory
    owner: "{{ zrok2_agent_user }}"
    mode: "0755"

- name: Write bind-mount compose.yml
  ansible.builtin.copy:
    dest: "{{ zrok2_compose_dir }}/compose.yml"
    owner: "{{ zrok2_agent_user }}"
    mode: "0644"
    content: |
      services:
        zrok-agent:
          image: {{ zrok2_docker_image }}
          restart: unless-stopped
          user: "{{ ansible_user_uid | default('1000') }}"
          environment:
            HOME: /mnt
          entrypoint:
            - bash
            - -c
            - rm -f /mnt/.zrok2/agent.socket && exec "$@"
          command:
            - --
            - zrok2
            - agent
            - start
            - --console-address
            - 0.0.0.0
          expose:
            - "{{ zrok2_agent_console_port }}"
          volumes:
            - {{ ansible_env.HOME }}/.zrok2:/mnt/.zrok2

- name: Start agent container
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ zrok2_compose_dir }}"
  become: true
  become_user: "{{ zrok2_agent_user }}"
  changed_when: true
