---
# Self-contained step 1: Pull the zrok2 image (no custom build needed)
# Doc: "Self-Contained Approach" — uses docker.io/openziti/zrok2 + busybox

- name: Pull zrok2 Docker image
  ansible.builtin.command:
    cmd: "docker pull {{ zrok2_docker_image }}"
  register: pull_result
  changed_when: "'Downloaded newer image' in pull_result.stdout or 'Pull complete' in pull_result.stdout"

- name: Pull busybox image for init container
  ansible.builtin.command:
    cmd: docker pull busybox
  register: busybox_pull
  changed_when: "'Downloaded newer image' in busybox_pull.stdout or 'Pull complete' in busybox_pull.stdout"
