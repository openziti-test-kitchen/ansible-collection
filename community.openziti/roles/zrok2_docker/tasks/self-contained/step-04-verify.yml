---
# Self-contained step 4: Verify agent is running
# Doc: "Start and Use" — verify with docker compose exec

- name: Wait for agent container to be running
  ansible.builtin.command:
    cmd: docker compose ps --format json
    chdir: "{{ zrok2_compose_dir }}"
  register: compose_ps
  changed_when: false
  retries: 15
  delay: 5
  until: "'running' in compose_ps.stdout"

- name: Verify agent responds inside container
  ansible.builtin.command:
    cmd: docker compose exec zrok-agent zrok2 agent status
    chdir: "{{ zrok2_compose_dir }}"
  register: agent_status
  changed_when: false
  retries: 10
  delay: 3
  until: agent_status.rc == 0

- name: Display agent status
  ansible.builtin.debug:
    var: agent_status.stdout_lines
